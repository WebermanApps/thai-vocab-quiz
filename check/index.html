["mw-thai-vocab-mc-v1","mw-thai-known","mw-thai-check-v1"].forEach(k=>{try{localStorage.removeItem(k)}catch(e){}});try{Object.keys(localStorage).filter(k=>/^mw-thai-(vocab-mc|check)-v2-6\d$/.test(k)).forEach(k=>localStorage.removeItem(k))}catch(e){}
const RESTORED=(()=>{try{return JSON.parse(localStorage.getItem("mw-thai-restored-v1"))||[]}catch(e){return[]}})();
const DATA=BASE.concat(ARCHIVE.filter(w=>RESTORED.includes(w.n)).map((w,i)=>({n:BASE.length+i+1,en:w.en,rom:w.rom,th:w.th,tone:w.tone,old:w.n})));
const $=id=>document.getElementById(id),byN=n=>DATA.find(d=>d.n===n),KEY="mw-thai-check-v2-"+DATA.length;
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6a8 8 0 0 1 0 12"/></svg>';
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function build(n){const w=byN(n),p=[w.en];for(const d of shuffle(DATA)){if(p.length===4)break;if(d.n!==n&&!p.includes(d.en))p.push(d.en)}return shuffle(p)}
let S=(()=>{try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.opts)return s}catch(e){}return null})();
if(!S){S={opts:{},ans:{}};DATA.forEach(d=>S.opts[d.n]=build(d.n))}DATA.forEach(d=>{if(!S.opts[d.n])S.opts[d.n]=build(d.n)});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}save();
function state(n){const a=S.ans[n];if(a===undefined)return"";if(a==="skip")return"sk";return S.opts[n][a]===byN(n).en?"ok":"bad"}
function rowHTML(d){const st=state(d.n),a=S.ans[d.n],locked=st!=="";
 const ops=S.opts[d.n].map((o,i)=>`<button class="btn opt mw-hover${locked&&o===d.en&&st!=="sk"?" right":""}${locked&&a===i&&st==="bad"?" mine":""}" data-a="${i}"${locked?" disabled":""}>${esc(o)}</button>`).join("");
 const lab={ok:"✓ Correct",bad:"✗ Wrong",sk:"Skipped","":""}[st];
 return `<div class="hd"><div class="w"><span class="n">#${d.n}</span><span class="rom">${esc(d.rom)}</span><span class="th" lang="th">${esc(d.th)}</span></div><button class="say mw-hover" type="button" data-say aria-label="Play ${esc(d.rom)}">${SPK}</button></div><div class="opts">${ops}</div><div class="act"><span class="st">${lab}</span>${locked?'<button class="btn sm mw-hover" data-undo type="button">Undo</button>':'<button class="btn sm mw-hover" data-skip type="button">Skip</button>'}</div>`}
function paint(n){const li=document.querySelector(`[data-n="${n}"]`);li.className="row "+state(n);li.innerHTML=rowHTML(byN(n))}
function counts(){let c={ok:0,bad:0,sk:0,"":0};DATA.forEach(d=>c[state(d.n)]++);$("cOk").textContent=c.ok;$("cBad").textContent=c.bad;$("cSk").textContent=c.sk;$("cLeft").textContent=c[""];$("out").value=report()}
function grp(k){return DATA.filter(d=>state(d.n)===k).map(d=>`#${d.n} ${d.th} ${d.rom} (${d.en})`).join(", ")||"none"}
function report(){return `Thai Vocab Check\nKNOWN (move to Known Words): ${grp("ok")}\n\nSKIPPED (keep): ${grp("sk")}\n\nWRONG (keep): ${grp("bad")}\n\nUNANSWERED: ${grp("")}`}
$("list").innerHTML=DATA.map(d=>`<li class="row ${state(d.n)}" data-n="${d.n}">${rowHTML(d)}</li>`).join("");counts();
$("list").addEventListener("click",e=>{const li=e.target.closest("[data-n]");if(!li)return;const n=+li.dataset.n,b=e.target.closest("button");if(!b)return;
 if(b.hasAttribute("data-say"))return say(byN(n).th);
 if(b.dataset.a!==undefined&&S.ans[n]===undefined)S.ans[n]=+b.dataset.a;else if(b.hasAttribute("data-skip"))S.ans[n]="skip";else if(b.hasAttribute("data-undo"))delete S.ans[n];else return;
 save();paint(n);counts()});
/* audio: best Thai voice, else Google TTS */
let V=null,VS=-9;function vs(x){const n=x.name||"";let s=0;if(/google/i.test(n))s+=4;if(/enhanced|premium|neural|natural|online/i.test(n))s+=4;if(x.localService===false)s+=2;if(/compact|espeak/i.test(n))s-=5;return s}
function pv(){if(!("speechSynthesis" in window))return;const v=speechSynthesis.getVoices().filter(x=>/^th/i.test(x.lang)).sort((a,b)=>vs(b)-vs(a));V=v[0]||null;VS=V?vs(V):-9}
if("speechSynthesis" in window){pv();speechSynthesis.onvoiceschanged=pv}
const AU=new Audio();function gtts(t,fail){AU.volume=1;AU.onerror=fail;AU.src="https://translate.google.com/translate_tts?ie=UTF-8&tl=th&client=tw-ob&q="+encodeURIComponent(t);const p=AU.play();if(p&&p.catch)p.catch(fail)}
function voice(t,fail){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="th-TH";try{u.voice=V}catch(_){}u.rate=.7;u.volume=1;u.onerror=e=>{if(e.error!=="interrupted"&&e.error!=="canceled")fail()};speechSynthesis.speak(u);return true}catch(e){return false}}
const nope=()=>toast("Audio not available on this device.");
function say(t){t=t.replace(/…/g," ").replace(/\s+/g," ").trim();if("speechSynthesis" in window&&!V)pv();
 if(V&&VS>0){if(!voice(t,()=>gtts(t,nope)))gtts(t,nope)}else gtts(t,()=>{if(!(V&&voice(t,nope)))nope()})}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2000)}
$("submit").onclick=async()=>{const text=report();$("out").value=text;
 if(navigator.share){try{await navigator.share({title:"Thai Vocab Check",text});return}catch(e){if(e&&e.name==="AbortError")return}}
 let ok=false;try{await navigator.clipboard.writeText(text);ok=true}catch(e){}
 const a=$("sms");a.href="sms:?&body="+encodeURIComponent(text);a.classList.remove("hide");toast(ok?"Copied. Paste it or send by SMS":"Copy the text above or send by SMS")};
$("reset").onclick=()=>{if(confirm("Reset all answers?")){S.ans={};save();DATA.forEach(d=>paint(d.n));counts()}};
