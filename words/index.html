const CFG={key:"mw-thai-word-cards-v2-94",title:"Thai Word Flashcards",cards:CARDS,showWord:m=>m==="s2e"?"Meaning":"Sound",
 modes:[{k:"e2s",l:"English To Sound"},{k:"s2e",l:"Sound To English"}],
 filters:[{k:"all",l:"All",fn:()=>true},{k:"a",l:"1–24",fn:rng(1,24)},{k:"b",l:"25–48",fn:rng(25,48)},{k:"c",l:"49–72",fn:rng(49,72)},{k:"d",l:"73–94",fn:rng(73,94)}],
 speak:w=>w.th,
 front:(w,m)=>`<div class="tag">#${w.n}</div>`+(m==="s2e"?`<div class="rom">${esc(w.rom)}</div><div class="muted">${esc(w.tone)}</div>`:`<div class="big">${esc(w.en)}</div>`),
 back:(w,m)=>(m==="s2e"?`<div class="big">${esc(w.en)}</div>`:`<div class="rom">${esc(w.rom)}</div><div class="muted">${esc(w.tone)}</div>`)+`<div class="th" lang="th" style="font-size:40px;line-height:1.5">${esc(w.th)}</div>`,
 help:'<div class="help"><b>Tones:</b> flat (mid), low, falling, high, rising. Multi-syllable words list one tone per syllable. Tap the card or press Space to reveal. Arrow keys move, G = Got It, A = Again, S = play sound.</div>'};

const $=id=>document.getElementById(id);let S;
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 0 1 0 6"/><path d="M19 6a8 8 0 0 1 0 12"/></svg>';
function esc(t){return String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
const IDX={};CFG.cards.forEach(c=>IDX[c.id]=c);
function deck(){const f=CFG.filters.find(x=>x.k===S.filter)||CFG.filters[0];return CFG.cards.filter(f.fn)}
function build(sh){const ids=deck().map(c=>c.id);S.queue=sh?shuffle(ids):ids;S.pos=0;S.shown=false;S.shuffled=!!sh;save()}
function save(){try{localStorage.setItem(CFG.key,JSON.stringify(S))}catch(e){}}
function load(){try{S=JSON.parse(localStorage.getItem(CFG.key))}catch(e){}if(!S||typeof S!=="object")S={};S.got=S.got||{};S.again=S.again||{};S.filter=S.filter||CFG.filters[0].k;S.mode=S.mode||(CFG.modes?CFG.modes[0].k:"");
 if(!S.queue||!S.queue.length)build(false);S.queue=S.queue.filter(i=>IDX[i]);if(!S.queue.length)build(false);if(!(S.pos>=0)||S.pos>S.queue.length)S.pos=0}
function counts(){const d=deck();let g=0,a=0;d.forEach(c=>{if(S.got[c.id])g++;else if(S.again[c.id])a++});return{n:d.length,g,a}}
function render(){const c=counts(),q=S.queue,done=S.pos>=q.length;let h="";
 if(CFG.modes){h+='<div class="chips">'+CFG.modes.map(m=>`<button class="btn sm mw-hover${S.mode===m.k?" on":""}" data-mode="${m.k}">${m.l}</button>`).join("")+"</div>"}
 h+='<div class="chips">'+CFG.filters.map(f=>`<button class="btn sm mw-hover${S.filter===f.k?" on":""}" data-filter="${f.k}">${f.l}</button>`).join("")+"</div>";
 h+=`<div class="stats"><span>${done?q.length:S.pos+1}/${q.length}${S.shuffled?" · Shuffled":""}</span><span>${c.g} got it · ${c.a} again</span></div><div class="bar"><i style="width:${c.n?Math.round(100*c.g/c.n):0}%"></i></div>`;
 if(done){h+=`<div class="card" style="cursor:default"><h2>Deck Finished</h2><p class="muted">${c.g} of ${c.n} marked Got It.</p></div><button class="btn solid mw-hover full" data-act="restart">Start Again</button><button class="btn mw-hover full" data-act="review">Practice Cards Not Yet Got</button>`}
 else{const card=IDX[q[S.pos]],sp=CFG.speak(card);
  h+=`<div class="card" data-act="flip">${CFG.front(card,S.mode)}${sp?`<button class="say mw-hover" type="button" data-say aria-label="Play sound">${SPK}</button>`:""}${S.shown?`<div class="ans">${CFG.back(card,S.mode)}</div>`:""}</div><div class="anote hide" id="anote">Audio not available on this device.</div>`;
  h+=S.shown?'<div class="row"><button class="btn mw-hover" data-act="again">Again</button><button class="btn solid mw-hover" data-act="got">Got It</button></div>':`<button class="btn solid mw-hover full" data-act="flip">Show ${CFG.showWord(S.mode)}</button>`;
  h+='<div class="row"><button class="btn mw-hover" data-act="prev">Prev</button><button class="btn mw-hover" data-act="next">Next</button></div>'}
 h+='<div class="row" style="grid-template-columns:1fr 1fr 1fr"><button class="btn sm mw-hover" data-act="shuffle">Shuffle</button><button class="btn sm mw-hover" data-act="order">In Order</button><button class="btn sm mw-hover" data-act="reset">Reset</button></div>'+CFG.help;
 $("app").innerHTML=h}
function act(a){const q=S.queue,id=q[S.pos];
 if(a==="flip"){if(S.pos<q.length)S.shown=!S.shown}else if(a==="next"){if(S.pos<q.length){S.pos++;S.shown=false}}else if(a==="prev"){if(S.pos>0){S.pos--;S.shown=false}}
 else if(a==="got"){S.got[id]=1;delete S.again[id];S.pos++;S.shown=false}else if(a==="again"){delete S.got[id];S.again[id]=1;q.splice(Math.min(S.pos+5,q.length),0,id);S.pos++;S.shown=false}
 else if(a==="shuffle")build(true);else if(a==="order")build(false);else if(a==="restart")build(S.shuffled);
 else if(a==="review"){const ids=deck().map(c=>c.id).filter(i=>!S.got[i]);if(!ids.length)build(S.shuffled);else{S.queue=S.shuffled?shuffle(ids):ids;S.pos=0;S.shown=false}}
 else if(a==="reset"){if(!confirm("Reset all progress for this deck?"))return;S={got:{},again:{},filter:S.filter,mode:S.mode};build(false)}
 save();render()}
$("app").addEventListener("click",e=>{const t=e.target.closest("[data-say],[data-act],[data-filter],[data-mode]");if(!t)return;
 if(t.hasAttribute("data-say")){e.stopPropagation();const c=IDX[S.queue[S.pos]];if(c)say(CFG.speak(c));return}
 if(t.dataset.filter){S.filter=t.dataset.filter;build(S.shuffled);render();return}if(t.dataset.mode){S.mode=t.dataset.mode;S.shown=false;save();render();return}act(t.dataset.act)});
document.addEventListener("keydown",e=>{if(/INPUT|TEXTAREA/.test(e.target.tagName)||e.metaKey||e.ctrlKey)return;const k=e.key;
 if(k===" "||k==="Enter"){e.preventDefault();if(S.pos>=S.queue.length)return;if(S.shown&&k===" ")act("next");else act("flip")}
 else if(k==="ArrowRight"){e.preventDefault();act("next")}else if(k==="ArrowLeft"){e.preventDefault();act("prev")}
 else if((k==="g"||k==="G")&&S.shown)act("got");else if((k==="a"||k==="A")&&S.shown)act("again");else if(k==="s"||k==="S"){const c=IDX[S.queue[S.pos]];if(c&&CFG.speak(c))say(CFG.speak(c))}});
/* audio */
let V=null,VS=-9;function vs(x){const n=x.name||"";let s=0;if(/google/i.test(n))s+=4;if(/enhanced|premium|neural|natural|online/i.test(n))s+=4;if(x.localService===false)s+=2;if(/compact|espeak/i.test(n))s-=5;return s}
function pv(){if(!("speechSynthesis" in window))return;const v=speechSynthesis.getVoices().filter(x=>/^th/i.test(x.lang)).sort((a,b)=>vs(b)-vs(a));V=v[0]||null;VS=V?vs(V):-9}
if("speechSynthesis" in window){pv();speechSynthesis.onvoiceschanged=pv}
const AU=new Audio();const nope=()=>{const n=$("anote");if(n)n.classList.remove("hide")};
function gtts(t,fail){AU.volume=1;AU.onerror=fail;AU.src="https://translate.google.com/translate_tts?ie=UTF-8&tl=th&client=tw-ob&q="+encodeURIComponent(t);const p=AU.play();if(p&&p.catch)p.catch(fail)}
function voice(t,fail){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="th-TH";try{u.voice=V}catch(_){}u.rate=.7;u.volume=1;u.onerror=e=>{if(e.error!=="interrupted"&&e.error!=="canceled")fail()};speechSynthesis.speak(u);return true}catch(e){return false}}
function say(t){t=String(t).replace(/…/g," ").replace(/\s+/g," ").trim();if("speechSynthesis" in window&&!V)pv();if(V&&VS>0){if(!voice(t,()=>gtts(t,nope)))gtts(t,nope)}else gtts(t,()=>{if(!(V&&voice(t,nope)))nope()})}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1800)}
$("share").onclick=async()=>{const c=counts(),url=location.href.split("?")[0],text=`${CFG.title}: ${c.g} of ${c.n} got it, ${c.a} to practise again.`;
 if(navigator.share){try{await navigator.share({title:CFG.title,text,url});return}catch(e){if(e&&e.name==="AbortError")return}}
 try{await navigator.clipboard.writeText(text+" "+url);toast("Copied")}catch(e){location.href="sms:?&body="+encodeURIComponent(text+" "+url)}};
load();render();
</script></body></html>
